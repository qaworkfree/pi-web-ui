# pi-web-ui Electron 桌面版发布 CI
# 在 tag（v*）推送时触发：构建三平台安装包并上传到 GitHub Releases。
#
# 环境变量说明（GitHub Secrets）：
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#                      macOS 签名 + 公证（可选，不设置仍可构建，但 macOS 会提示「无法验证」）
#   CSC_LINK / CSC_KEY_PASSWORD
#                      代码签名证书（Windows Authenticode / macOS Developer ID）
#                      不设置：Windows 构建不签名，macOS 只构建不签名（dmg 对未签名应用会拦截）
#   GH_TOKEN / GITHUB_TOKEN
#                      自动提供，用于上传 Release 资源
#
# Reference: https://www.electron.build/configuration/publish

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        type: choice
        options:
          - all
          - mac
          - win
          - linux
        default: all

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [x64, arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install setuptools 2>/dev/null || true

      - name: Build web + server
        run: npm run build

      - name: Build Electron (macOS)
        run: npx electron-builder build --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（可选）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Setup MSVC build tools
        shell: pwsh
        run: |
          echo "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build web + server
        run: npm run build

      - name: Build Electron (Windows)
        run: npx electron-builder build --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows 签名（可选）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies


      - name: Install system deps (node-gyp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-setuptools 2>/dev/null || true
        run: npm ci

      - name: Build web + server
        run: npm run build

      - name: Build Electron (Linux)
        run: npx electron-builder build --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 如果不想三平台并行，可以用一个 matrix job 代替
  # 但分开更清晰，方便单独重跑失败平台