# pi-web-ui Electron 打包配置
# 构建：npm run build:electron 或 npm run build:electron:mac / :win / :linux
# 发布：npm run publish:electron（构建并上传到 GitHub Releases）

appId: com.xingshuyin.pi-web-ui
productName: pi-web-ui
copyright: Copyright © 2025 xingshuyin

directories:
  output: release
  buildResources: electron

# Electron 主进程入口（已在 package.json main 中指定）
# 这里只需要告诉 electron-builder 打包哪些文件到 asar 中
files:
  - electron/**/*.mjs
  - node_modules/**/*
  - "!node_modules/**/{test,tests,example,examples,docs,doc,typings,types,__tests__,__pycache__}/**"
  - "!node_modules/*/{CHANGELOG*,changelog*,README*,readme*,CONTRIBUTING*,History*,history*,LICENSE*,license*,SECURITY*,security*}"
  - "!node_modules/**/*.{md,ts,tsbuildinfo,map,yml,yaml,xml,woff,woff2,txt,editorconfig,gitkeep,gitignore,prettierrc,jshintrc,eslintrc}"
  - "!node_modules/**/{.github,.git,.npmignore,.DS_Store,Makefile,CMakeLists.txt,Gulpfile.js,Gruntfile.js,Rakefile,rakefile,makefile,rollup.config.*,vite.config.*,webpack.config.*,jest.config.*,tsconfig.*,babel.config.*,eslintrc.*,prettier.*,stylelint.*,commitlint.*,husky.*,lint-staged.*,editorconfig,gitattributes,gitignore,npmignore,prettierrc,eslintignore,eslintrc,stylelintrc,postcss.config.*,browserslist*,babel.*,nycrc*}"

# extraResources：server 子进程需要访问的文件
# 这些文件放在 resources/ 目录下（不进 asar），子进程通过 process.resourcesPath 访问
extraResources:
  - from: dist
    to: dist
  - from: web/dist
    to: web/dist
  - from: themes
    to: themes
  - from: extensions
    to: extensions

asar: true
asarUnpack: []

# 原生模块：electron-builder 自动 rebuild（node-pty 等）
# 不需要额外配置，默认行为就是 rebuild
# 但对于 node-pty，需要确保它被包含在打包中
nodeGypRebuild: false
npmRebuild: true

# macOS
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # 以下为签名配置，需要在 CI 中设置环境变量
  # identity: null  # 不签名也可构建，但 macOS 会提示「无法验证开发者」
  artifactName: "${name}-${version}-mac-${arch}.${ext}"

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 不签名
  signAndEditExecutable: false
  artifactName: "${name}-${version}-win-x64.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: pi-web-ui
  artifactName: "${name}-${version}-setup-x64.${ext}"

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  artifactName: "${name}-${version}-linux-${arch}.${ext}"

# 发布：GitHub Releases
publish:
  provider: github
  owner: xing-shuyin
  repo: pi-web-ui
  releaseType: release